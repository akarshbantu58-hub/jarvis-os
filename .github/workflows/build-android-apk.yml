name: Build Native Kotlin JARVIS OS APK

on:
  push:
    branches: [main]
    paths:
      - 'native-android/**'
      - '.github/workflows/build-android-apk.yml'
  pull_request:
    branches: [main]
    paths:
      - 'native-android/**'
      - '.github/workflows/build-android-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jarvis-native-android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-apk:
    name: Build native Kotlin debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java for Android build tools
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          echo "${ANDROID_HOME:-/usr/local/lib/android/sdk}/platform-tools" >> "$GITHUB_PATH"
          SDKMANAGER="${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/16.0/bin/sdkmanager"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Verify native Kotlin project
        run: |
          test -f native-android/app/src/main/java/com/akcreations/jarvisos/MainActivity.kt
          test -f native-android/app/src/main/AndroidManifest.xml
          if find native-android -type f \( -name '*.py' -o -name '*.java' \) | grep -q .; then
            echo "Python or Java source found; this project must use Kotlin source only."
            exit 1
          fi

      - name: Build native Android APK
        run: gradle --no-daemon -p native-android assembleDebug

      - name: Report APK size
        shell: bash
        run: |
          APK="native-android/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          BYTES=$(stat -c%s "$APK")
          MIB=$(awk "BEGIN { printf \"%.2f\", $BYTES / 1048576 }")
          echo "APK size: ${MIB} MiB (${BYTES} bytes)"
          echo "APK_SIZE_MIB=${MIB}" >> "$GITHUB_ENV"

      - name: Upload native APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-os-native-kotlin-apk
          path: native-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Build summary
        if: always()
        run: |
          {
            echo "## JARVIS OS — Native Kotlin build"
            echo ""
            echo "- Source: Kotlin + Jetpack Compose"
            echo "- No Python source and no Java source"
            echo "- APK size: ${APK_SIZE_MIB:-not produced} MiB"
            echo "- This is an early native migration foundation; web/PWA features have not all been ported yet."
          } >> "$GITHUB_STEP_SUMMARY"
